<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shop</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background-color: #f7f4ef; /* soft cream */
            color: #4a433b; /* warm brown */
        }

        /* Header */
        h1 {
            text-align: center;
            margin-top: 40px;
            font-size: 2.4rem;
            color: #5a5248;
            letter-spacing: 1px;
        }

        /* Cozy divider */
        .divider {
            width: 80px;
            height: 4px;
            background-color: #d8c7b4; /* warm beige */
            border-radius: 10px;
            margin: 15px auto 30px auto;
        }

        /* Navigation below header */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 40px;
        }

        .nav-links a {
            text-decoration: none;
            color: #4a433b;
            font-weight: 600;
            background-color: #e3d7c9; /* cozy beige */
            padding: 10px 20px;
            border-radius: 20px; /* pill shape */
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.2s ease;
        }

        .nav-links a:hover {
            background-color: #d6c6b4;
            transform: translateY(-2px);
        }

        /* Cozy content box */
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .container p {
            font-size: 1.15rem;
            line-height: 1.7;
        }

        /* Cozy accent section */
        .accent-box {
            margin: 40px auto;
            max-width: 700px;
            background-color: #efe7dd; /* soft latte tone */
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .accent-box p {
            margin: 0;
            font-size: 1.1rem;
            color: #5a5248;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Online Shop</h1>

    <div class="divider"></div>

    <!-- Navigation below header -->
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Cart <span id="cart-count">0</span></a>
    </div>

    <div class="container">
        <p>This is my Week 1 project. More cozy features coming soon!</p>
    </div>

    <div class="accent-box">
        <p>☕ Grab a warm drink and enjoy browsing.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>

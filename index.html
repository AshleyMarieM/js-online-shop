<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shop</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background-color: #f7f4ef; /* soft cream */
            color: #4a433b; /* warm brown */
        }

        /* Header */
        h1 {
            text-align: center;
            margin-top: 40px;
            font-size: 2.2rem;
            color: #5a5248;
        }

        /* Navigation moved BELOW header */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .nav-links a {
            text-decoration: none;
            color: #4a433b;
            font-weight: 600;
            background-color: #e3d7c9; /* cozy beige */
            padding: 10px 18px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .container p {
            font-size: 1.15rem;
            line-height: 1.7;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Online Shop</h1>

    <!-- Navigation moved below header -->
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Cart <span id="cart-count">0</span></a>
    </div>

    <div class="container">
        <p>This is my Week 1 project. More cozy features coming soon!</p>
    </div>

    <script src="app.js"></script>
</body>
</html>

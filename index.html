<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shop</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background-color: #f7f4ef; /* soft cream */
            color: #4a433b; /* warm brown */
        }

        nav {
            background-color: #e3d7c9; /* cozy beige */
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        nav a {
            text-decoration: none;
            color: #4a433b;
            font-weight: 600;
        }

        h1 {
            text-align: center;
            margin-top: 50px;
            font-size: 2.2rem;
            color: #5a5248;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .container p {
            font-size: 1.15rem;
            line-height: 1.7;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Cart <span id="cart-count">0</span></a></li>
        </ul>
    </nav>

    <h1>Welcome to My Online Shop</h1>

    <div class="container">
        <p>This is my Week 1 project. More cozy features coming soon!</p>
    </div>

    <script src="app.js"></script>
</body>
</html>

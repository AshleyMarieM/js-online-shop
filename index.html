<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Cup & Candle Co.</title>
    <style>
        :root {
            --bg: #f6efe8;
            --bg-strong: #efe1d1;
            --surface: #fffdfb;
            --card: #fffaf3;
            --beige: #e4c7a7;
            --beige-dark: #d3a979;
            --coffee: #5a3422;
            --coffee-deep: #3a2219;
            --latte: #f0e4d6;
            --accent: #b66c44;
            --text: #43352f;
            --text-soft: #6b544d;
            --shadow: rgba(58, 34, 25, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(to bottom, var(--bg), #f9f2eb);
            color: var(--text);
        }

        h1 {
            text-align: center;
            margin-top: 40px;
            font-size: 3.1rem;
            color: var(--coffee-deep);
            font-family: "Brush Script MT", "Lucida Handwriting", cursive;
            font-weight: normal;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.06);
        }

        .divider {
            width: 90px;
            height: 4px;
            background: linear-gradient(to right, var(--beige), var(--accent));
            border-radius: 10px;
            margin: 15px auto 30px auto;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--coffee-deep);
            font-weight: 700;
            background-color: var(--latte);
            padding: 12px 20px;
            border-radius: 999px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            transition: 0.2s ease;
        }

        .nav-links a:hover {
            background-color: var(--beige);
            transform: translateY(-2px);
        }

        .page-shell {
            max-width: 1120px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .shop-layout {
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .product-panel,
        .cart-panel {
            background: var(--surface);
            border-radius: 18px;
            box-shadow: 0 5px 18px var(--shadow);
            padding: 25px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .section-header h2 {
            margin: 0;
            font-size: 1.9rem;
            color: var(--coffee-deep);
        }

        .tab-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .tab-btn,
        .add-btn {
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            background-color: var(--beige);
            color: var(--coffee-deep);
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .tab-btn:hover,
        .add-btn:hover {
            background-color: var(--beige-dark);
        }

        .tab-btn.active {
            background-color: var(--coffee);
            color: white;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card);
            border: 1px solid #e8dbcb;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 3px 10px rgba(58, 34, 25, 0.04);
        }

        .product-icon {
            font-size: 2.1rem;
            margin-bottom: 12px;
        }

        .product-card h3 {
            margin: 0 0 8px;
            font-size: 1.2rem;
            color: var(--coffee-deep);
        }

        .product-category {
            display: inline-block;
            margin-bottom: 12px;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 800;
        }

        .product-card p {
            margin: 0 0 16px;
            line-height: 1.6;
            color: var(--text-soft);
        }

        .product-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .price {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--coffee-deep);
        }

        .cart-panel h2 {
            margin-top: 0;
            color: var(--coffee-deep);
        }

        .cart-items {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 12px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0e2d6;
            color: var(--text);
        }

        .cart-total {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #f0e2d6;
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            color: var(--coffee-deep);
        }

        .empty-cart {
            color: var(--text-soft);
            font-style: italic;
        }

        .accent-box {
            margin: 30px auto 0;
            background: linear-gradient(135deg, var(--bg-strong), var(--latte));
            padding: 22px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .accent-box p {
            margin: 0;
            font-size: 1.12rem;
            color: var(--coffee-deep);
        }

        @media (max-width: 800px) {
            .shop-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Cozy Cup & Candle Co.</h1>
    <div class="divider"></div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Handmade</a>
        <a href="#">Coffee & Candles</a>
        <a href="#">Cart <span id="cart-count">0</span></a>
    </div>

    <div class="page-shell">
        <div class="shop-layout">
            <section class="product-panel">
                <div class="section-header">
                    <h2>Today’s Favorites</h2>
                    <ul class="tab-list" aria-label="Product tabs">
                        <li><button class="tab-btn active" data-category="All" aria-pressed="true">All</button></li>
                        <li><button class="tab-btn" data-category="Handmade" aria-pressed="false">Handmade</button></li>
                        <li><button class="tab-btn" data-category="Home Fragrance" aria-pressed="false">Home Fragrance</button></li>
                    </ul>
                </div>
                <div id="product-list" class="product-grid" aria-live="polite"></div>
            </section>

            <aside class="cart-panel">
                <h2>Your Cozy Cart</h2>
                <ul id="cart-items" class="cart-items" aria-live="polite"></ul>
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cart-total">$0.00</span>
                </div>
            </aside>
        </div>

        <div class="accent-box">
            <p>☕ Slow sips, soft scents, and handcrafted comfort.</p>
        </div>

    <script src="app.js"></script>
</body>
</html>
<div class="login-box">
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <p id="login-error" class="error-message"></p>

    <button id="login-btn" onclick="validateLogin()">Login</button>
</div>
